<svg width="800" height="250" viewBox="0 0 800 250" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#161b22;stop-opacity:1" />
    </linearGradient>

    <!-- Signal Gradient -->
    <linearGradient id="signal" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#58a6ff;stop-opacity:0" />
      <stop offset="20%" style="stop-color:#58a6ff;stop-opacity:1" />
      <stop offset="80%" style="stop-color:#79c0ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#79c0ff;stop-opacity:0" />
    </linearGradient>

    <style>
      /* Smooth pulsing and sliding animation */
      @keyframes slideWave {
        0% { transform: translateX(0px); }
        100% { transform: translateX(-400px); }
      }
      
      @keyframes pulseText {
        0%, 100% { opacity: 0.85; }
        50% { opacity: 1; text-shadow: 0 0 10px rgba(88, 166, 255, 0.4); }
      }

      .animated-wave {
        animation: slideWave 6s linear infinite;
      }
      
      .title {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
        font-size: 32px;
        font-weight: 700;
        fill: #c9d1d9;
        text-anchor: middle;
        animation: pulseText 4s ease-in-out infinite;
      }

      .subtitle {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
        font-size: 16px;
        font-weight: 400;
        fill: #8b949e;
        text-anchor: middle;
      }
      
      .grid-line {
        stroke: #30363d;
        stroke-width: 1;
        opacity: 0.5;
      }
    </style>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="url(#bg)" rx="8" />

  <!-- Subtle Grid Pattern -->
  <g class="grid-line">
    <line x1="0" y1="50" x2="800" y2="50" />
    <line x1="0" y1="100" x2="800" y2="100" />
    <line x1="0" y1="150" x2="800" y2="150" />
    <line x1="0" y1="200" x2="800" y2="200" />
    <line x1="200" y1="0" x2="200" y2="250" />
    <line x1="400" y1="0" x2="400" y2="250" />
    <line x1="600" y1="0" x2="600" y2="250" />
  </g>

  <!-- The Animated Signal Wave -->
  <!-- We draw a wide sine wave that translates to the left infinitely -->
  <svg x="0" y="20" width="800" height="250">
    <g class="animated-wave">
      <!-- Wave spans from x=0 to x=1200 to allow smooth scrolling loop of width 400 -->
      <path d="M 0,100 C 100,20 100,180 200,100 C 300,20 300,180 400,100 C 500,20 500,180 600,100 C 700,20 700,180 800,100 C 900,20 900,180 1000,100 C 1100,20 1100,180 1200,100" 
            fill="none" 
            stroke="url(#signal)" 
            stroke-width="3" 
            stroke-linecap="round" />
    </g>
  </svg>

  <!-- Typography overlay -->
  <rect x="250" y="80" width="300" height="90" fill="#0d1117" opacity="0.8" rx="8" />
  <text x="400" y="115" class="title">DSP Lab</text>
  <text x="400" y="145" class="subtitle">Digital Signal Processing</text>
  
</svg>
