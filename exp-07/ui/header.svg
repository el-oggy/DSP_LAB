<svg width="800" height="250" viewBox="0 0 800 250" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      /* Single flat style block for GitHub Camo compatibility */
      @keyframes sweep { 0% { transform: translateX(0); } 100% { transform: translateX(650px); } }
      @keyframes popBar { 0%, 100% { transform: scaleY(0.1); } 50% { transform: scaleY(1); } }
      @keyframes draw { 0% { stroke-dashoffset: 800; } 100% { stroke-dashoffset: 0; } }
      @keyframes pulse { 0%, 100% { opacity: 0.3; } 50% { opacity: 1; } }
      @keyframes slide { 0% { transform: translateX(-100px); } 50% { transform: translateX(200px); } 100% { transform: translateX(-100px); } }
      @keyframes slideMatch { 0% { transform: translateX(-200px); filter: drop-shadow(0 0 0px #3fb950); } 50% { transform: translateX(0px); filter: drop-shadow(0 0 15px #3fb950); stroke: #3fb950; } 100% { transform: translateX(200px); filter: drop-shadow(0 0 0px #3fb950); } }
      @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
      
      .bg { fill: #0d1117; }
      .axis { stroke: #484f58; stroke-width: 2; }
      .stem { stroke: #3fb950; stroke-width: 2; }
      .dot { fill: #3fb950; }
      .bar { fill: #3fb950; transform-origin: center 180px; animation: popBar 2s ease-in-out infinite; }
      .scanner { stroke: rgba(63, 185, 80, 0.8); stroke-width: 2; animation: sweep 4s linear infinite; }
      .scanner-glow { fill: url(#grad-scan); animation: sweep 4s linear infinite; }
      
      .signal-draw { fill: none; stroke: #3fb950; stroke-width: 3; stroke-dasharray: 800; animation: draw 3s ease-in-out infinite alternate; }
      .signal-static { fill: none; stroke: #484f58; stroke-width: 3; }
      .signal-match { fill: none; stroke: #3fb950; stroke-width: 3; animation: slideMatch 4s ease-in-out infinite; }
      
      .box-static { fill: rgba(72,79,88,0.2); stroke: #484f58; stroke-width: 2; }
      .box-slide { fill: rgba(63,185,80,0.2); stroke: #3fb950; stroke-width: 2; animation: slide 4s ease-in-out infinite; }
      
      .ring { fill: none; stroke: #21262d; stroke-width: 2; }
      .ring-dashed { fill: none; stroke: #484f58; stroke-width: 3; stroke-dasharray: 10,10; }
      .arc-spin { fill: none; stroke: #3fb950; stroke-width: 4; stroke-dasharray: 50, 200; transform-origin: 400px 125px; animation: spin 3s linear infinite; }
      
      .radar-sweep { fill: url(#grad-radar); transform-origin: 400px 125px; animation: spin 4s linear infinite; }
      .radar-line { stroke: #3fb950; stroke-width: 2; transform-origin: 400px 125px; animation: spin 4s linear infinite; }
      
      .net1 { stroke: #3fb950; stroke-width: 2; opacity: 0.2; animation: pulse 2s infinite; }
      .net2 { stroke: #3fb950; stroke-width: 2; opacity: 0.2; animation: pulse 2s infinite 1s; }
      
      .fade-group1 { animation: pulse 3s infinite 0s; }
      .fade-group2 { animation: pulse 3s infinite 1s; }
      .fade-group3 { animation: pulse 3s infinite 2s; }
      .stem-group { animation: pulse 4s infinite; }
      
      .text-title { font-family: 'Consolas', 'Courier New', monospace; font-size: 20px; font-weight: 600; fill: #c9d1d9; }
      .text-sub { font-family: 'Consolas', 'Courier New', monospace; font-size: 13px; fill: #8b949e; }
    </style>
    
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#21262d" />
    </pattern>
    <linearGradient id="grad-scan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:rgba(63,185,80,0)" />
      <stop offset="100%" style="stop-color:rgba(63,185,80,0.2)" />
    </linearGradient>
    <linearGradient id="grad-radar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:rgba(63,185,80,0)" />
      <stop offset="100%" style="stop-color:rgba(63,185,80,0.4)" />
    </linearGradient>
  </defs>

  <rect class="bg" width="800" height="250" />
  
  
  <rect width="800" height="250" fill="url(#grid)" />
  
  <!-- Radar circles -->
  <circle cx="400" cy="125" r="80" class="ring" />
  <circle cx="400" cy="125" r="50" class="ring" />
  <circle cx="400" cy="125" r="20" class="ring" />
  
  <!-- Radar sweep -->
  <path class="radar-sweep" d="M 400,125 L 400,45 A 80,80 0 0,1 480,125 Z" />
  <line class="radar-line" x1="400" y1="125" x2="400" y2="45" />
  
  <!-- Data points -->
  <circle cx="440" cy="90" r="4" class="dot" style="animation: pulse 2s infinite" />
  <circle cx="350" cy="150" r="4" class="dot" style="animation: pulse 2.5s infinite" />
        

  <!-- Typography -->
  <text x="60" y="40" class="text-title">&gt; DFT Spectrum Visualization</text>
  <text x="60" y="215" class="text-sub">// Magnitude and Phase Spectra Radar</text>
</svg>
