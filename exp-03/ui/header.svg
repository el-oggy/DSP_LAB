<svg width="800" height="250" viewBox="0 0 800 250" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#161b22;stop-opacity:1" />
    </linearGradient>
    <style>
      @keyframes pulseText {
        0%, 100% { opacity: 0.85; }
        50% { opacity: 1; text-shadow: 0 0 10px rgba(88, 166, 255, 0.4); }
      }
      .title {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
        font-size: 28px;
        font-weight: 700;
        fill: #c9d1d9;
        text-anchor: middle;
        animation: pulseText 4s ease-in-out infinite;
      }
      .subtitle {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
        font-size: 14px;
        font-weight: 400;
        fill: #8b949e;
        text-anchor: middle;
      }
      .grid-line { stroke: #30363d; stroke-width: 1; opacity: 0.5; }
    </style>
  </defs>

  <rect width="100%" height="100%" fill="url(#bg)" rx="8" />

  <g class="grid-line">
    <line x1="0" y1="50" x2="800" y2="50" /><line x1="0" y1="100" x2="800" y2="100" />
    <line x1="0" y1="150" x2="800" y2="150" /><line x1="0" y1="200" x2="800" y2="200" />
    <line x1="200" y1="0" x2="200" y2="250" /><line x1="400" y1="0" x2="400" y2="250" />
    <line x1="600" y1="0" x2="600" y2="250" />
  </g>

  <!-- Animated Concept Area -->
  <svg x="0" y="20" width="800" height="200">
    
    <style>
      @keyframes floatEnv {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-10px); }
      }
      .env { animation: floatEnv 3s ease-in-out infinite; }
    </style>
    <path class="env" d="M 150,150 C 300,0 500,0 650,150" fill="rgba(88,166,255,0.2)" stroke="#58a6ff" stroke-width="3"/>
    <path class="env" d="M 150,150 C 300,50 500,50 650,150" fill="none" stroke="#79c0ff" stroke-width="2" stroke-dasharray="5,5"/>
        
  </svg>

  <rect x="250" y="190" width="300" height="50" fill="#0d1117" opacity="0.8" rx="8" />
  <text x="400" y="212" class="title">DTFT Analysis</text>
  <text x="400" y="232" class="subtitle">Discrete-Time Fourier Transform</text>
</svg>
