<svg width="800" height="250" viewBox="0 0 800 250" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#161b22;stop-opacity:1" />
    </linearGradient>
    <style>
      @keyframes pulseText {
        0%, 100% { opacity: 0.85; }
        50% { opacity: 1; text-shadow: 0 0 10px rgba(88, 166, 255, 0.4); }
      }
      .title {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
        font-size: 28px;
        font-weight: 700;
        fill: #c9d1d9;
        text-anchor: middle;
        animation: pulseText 4s ease-in-out infinite;
      }
      .subtitle {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
        font-size: 14px;
        font-weight: 400;
        fill: #8b949e;
        text-anchor: middle;
      }
      .grid-line { stroke: #30363d; stroke-width: 1; opacity: 0.5; }
    </style>
  </defs>

  <rect width="100%" height="100%" fill="url(#bg)" rx="8" />

  <g class="grid-line">
    <line x1="0" y1="50" x2="800" y2="50" /><line x1="0" y1="100" x2="800" y2="100" />
    <line x1="0" y1="150" x2="800" y2="150" /><line x1="0" y1="200" x2="800" y2="200" />
    <line x1="200" y1="0" x2="200" y2="250" /><line x1="400" y1="0" x2="400" y2="250" />
    <line x1="600" y1="0" x2="600" y2="250" />
  </g>

  <!-- Animated Concept Area -->
  <svg x="0" y="20" width="800" height="200">
    
    <style>
      @keyframes growBar {
        0%, 100% { transform: scaleY(0.1); }
        50% { transform: scaleY(1); }
      }
      .bar { fill: #58a6ff; transform-origin: bottom; }
    </style>
    <rect x="200" y="50" width="20" height="100" class="bar" style="animation: growBar 2s infinite 0.1s" />
    <rect x="250" y="80" width="20" height="70" class="bar" style="animation: growBar 2s infinite 0.3s" />
    <rect x="300" y="30" width="20" height="120" class="bar" style="animation: growBar 2s infinite 0.5s" />
    <rect x="350" y="90" width="20" height="60" class="bar" style="animation: growBar 2s infinite 0.7s" />
    <rect x="400" y="10" width="20" height="140" class="bar" style="animation: growBar 2s infinite 0.9s" />
    <rect x="450" y="60" width="20" height="90" class="bar" style="animation: growBar 2s infinite 1.1s" />
    <rect x="500" y="110" width="20" height="40" class="bar" style="animation: growBar 2s infinite 1.3s" />
    <rect x="550" y="40" width="20" height="110" class="bar" style="animation: growBar 2s infinite 1.5s" />
        
  </svg>

  <rect x="250" y="190" width="300" height="50" fill="#0d1117" opacity="0.8" rx="8" />
  <text x="400" y="212" class="title">Discrete Fourier Transform</text>
  <text x="400" y="232" class="subtitle">Time to Frequency Domain Mapping</text>
</svg>
